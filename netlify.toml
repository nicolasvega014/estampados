[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep the browser and checkout API on the same public domain. The API rule
# must remain before the SPA fallback so Mercado Pago can reach the webhook.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

